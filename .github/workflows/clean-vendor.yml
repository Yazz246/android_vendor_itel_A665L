name: Clean Vendor Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Vendor Tree
        uses: actions/checkout@v4

      - name: Bersihkan Android.bp, .mk, dan Salin Library Hilang
        run: |
          python3 - << 'EOF'
          import glob, os, re, shutil

          p = "Android.bp"

          # 1. Hapus file readme tidak terpakai di proprietary
          for rm_file in glob.glob("proprietary/**/readme", recursive=True):
              if os.path.isfile(rm_file):
                  os.remove(rm_file)

          # 2. Daftar lengkap executable & library standar AOSP (A-Z) yang bentrok
          conflict_mods = {
              "readme",
              "libwifi-hal",
              "boringssl_self_test32",
              "boringssl_self_test64",
              # Executable inti AOSP
              "dumpsys", "dumpstate", "bugreport", "bugreportz",
              "logcat", "logd", "logwrapper",
              "servicemanager", "hwservicemanager", "vndservicemanager",
              "sh", "toybox", "toolbox", "linker", "linker64",
              "app_process", "app_process32", "app_process64",
              "surfaceflinger", "audioserver", "cameraserver", "mediaserver",
              "vold", "netd", "installd", "adbd", "init", "ueventd", "watchdogd",
              "zygote", "zygote64", "lmkd", "tombstoned", "statsd",
              "keystore2", "gatekeeperd", "wpa_supplicant", "hostapd",
              "iptables", "ip6tables", "ip", "tc",
              # A
              "libaaudio", "libaaudio_internal", "libacryl",
              "libadbconnection_client", "libadbd_auth", "libadbd_fs",
              "libamidi", "libandroid", "libandroid_net", "libandroid_runtime",
              "libandroid_runtime_lazy", "libandroid_servers", "libandroidfw",
              "libappfuse", "libarect", "libartbase", "libartpalette",
              "libartpalette-system", "libasync_safe", "libaudioclient",
              "libaudioclient_aidl_conversion",
              "libaudio_aidl_conversion_common_ndk", "libaudio_system_headers",
              "libaudioeffect_jni", "libaudioflinger", "libaudiofoundation",
              "libaudiomanager", "libaudiopolicy", "libaudioprocessing",
              "libaudiospdif", "libaudioutils", "libavservices_minijail",
              "libavservices_minijail_vendor",
              # B
              "libbacktrace", "libbase", "libbcc", "libbcinfo", "libbinder",
              "libbinder_ndk", "libbinderdebug", "libbinderthreadstateutils",
              "libblas", "libbluetooth_gd", "libboringssl", "libbrotli",
              "libbt-bta", "libbt-common", "libbt-hci", "libbt-sbc-decoder",
              "libbt-sbc-encoder", "libbt-stack", "libbt-utils",
              "libbufferhub", "libbufferhubqueue",
              # C
              "libc", "libc++", "libc++abi", "libcamera2ndk",
              "libcamera_client", "libcamera_metadata", "libcameraservice",
              "libcap", "libcgrouprc", "libchrome", "libcld80211",
              "libcompiler_rt", "libcppbor", "libcppcose_rkp", "libcrypto",
              "libcrypto_utils", "libcups", "libcurl", "libcutils",
              # D
              "libdatasource", "libdebuggerd_client", "libdexfile",
              "libdexfile_external", "libdl", "libdl_android", "libdmabufheap",
              "libdng_sdk", "libdrm", "libdrmframework", "libdrmframeworkcommon",
              "libdumpstateaidl", "libdumpstateutil", "libdynamic_depth",
              # E
              "libEGL", "libeffects", "libeffectsconfig", "libeigen",
              "liberror_prone_annotations", "libevent", "libexif", "libexpat",
              # F
              "libfec", "libfiemap", "libfilterfw", "libfilterpack_imageproc",
              "libflac", "libflatbuffers-cpp", "libfmq", "libfs_mgr",
              "libfsmgr_binder", "libft2", "libfuse",
              # G
              "libGLESv1_CM", "libGLESv2", "libGLESv3", "libgatekeeper",
              "libgccunwind", "libgemmlowp", "libgralloctypes",
              "libgraphicsenv", "libgsi", "libgtest_prod", "libgui",
              # H
              "libhardware", "libhardware_legacy", "libharfbuzz_ng", "libheif",
              "libhidl-gen-utils", "libhidlallocatorutils", "libhidlbase",
              "libhidlmemory", "libhidltransport", "libhwbinder",
              "libhwc2on1adapter", "libhwc2onfbadapter", "libhwui",
              # I
              "libicui18n", "libicuuc", "libimage_io", "libimg_utils",
              "libincident", "libinput", "libinputflinger",
              "libinputflinger_base", "libion", "libiprouteutil", "libiterate",
              "libiwlan",
              # J - K
              "libjnihelper", "libjnigraphics", "libjpeg", "libjsoncpp",
              "libkeymint", "libkeystore-attestation-application-id",
              "libkeystore-engine-wifi-hidl", "libkeystore2_crypto", "libkll",
              # L
              "liblayers_proto", "libldacBT_abr", "libldacBT_enc",
              "liblodepng", "liblog", "liblogcat", "liblogwrap",
              "liblz4", "liblzma",
              # M
              "libm", "libmath", "libmdnssd", "libmedia",
              "libmedia_aidl_conversion", "libmedia_codeclist",
              "libmedia_helper", "libmedia_jni_utils", "libmedia_omx",
              "libmediadrm", "libmediaextractor", "libmediametrics",
              "libmediandk", "libmediautils", "libmeminfo", "libmemtrack",
              "libmemunreachable", "libminijail", "libminikin",
              "libmkbootimg_abi_check", "libmodpb64", "libmtp",
              # N
              "libnativedisplay", "libnativehelper", "libnativeloader",
              "libnativewindow", "libnbaio", "libnbaio_mono", "libnetd_client",
              "libnetlink", "libnetutils", "libnfc-nci", "libnfc_nci_jni",
              "libnl", "libnnapi",
              # O
              "libopenjdk", "libopenjdkjvm", "libopenjdkjvmti",
              "libopus", "libosi",
              # P
              "libpackageparser", "libpcap", "libpcre2", "libpdfium",
              "libpdx_default_transport", "libpiex", "libpng", "libpower",
              "libpowermanager", "libprocessgroup", "libprocinfo",
              "libprotobuf-cpp-full", "libprotobuf-cpp-lite",
              "libpuresoftkeymasterdevice",
              # Q - R
              "libqtaguid", "libradio_metadata", "libreference-ril",
              "libremotemessage", "libresourcemanagerservice", "libril",
              "librilutils", "librs_jni", "librtp_jni", "libruy",
              # S
              "libselinux", "libsensor", "libsensorservice",
              "libsensorservicehidl", "libsepol", "libservices", "libsigchain",
              "libskia", "libsoft_attestation_cert", "libsonivox",
              "libsoundpool", "libsoundtrigger", "libsoundtriggerservice",
              "libsparse", "libspeexresampler", "libsqlite", "libssl",
              "libstagefright", "libstagefright_foundation", "libstatspull",
              "libstatssocket", "libstdc++", "libsurfaceflinger",
              "libsurfaceflinger_client", "libsuspend", "libsync",
              "libsysutils",
              # T
              "libtextclassifier", "libtextclassifier_hash", "libtflite",
              "libtflite_static", "libthermal", "libtiff_directory",
              "libtinyalsa", "libtinycompress", "libtinyxml2",
              "libtombstoned_client", "libtrusty",
              # U
              "libui", "libultrahdr", "libunwindstack", "libusbhost",
              "libutils",
              # V
              "libvibrator", "libvibratorutils", "libvndksupport",
              "libvorbisidec", "libvpx", "libvulkan",
              # W - Z
              "libwebp-decode", "libwebp-encode",
              "libwebrtc_audio_preprocessing", "libwebviewchromium_loader",
              "libwebviewchromium_plat_support", "libwifi-system",
              "libwifi-system-iface", "libwilhelm", "libwpa_client",
              "libxml2", "libyuv", "libz", "libziparchive", "libzstd",
          }

          # Lindungi seluruh modul proprietary Unisoc / Spreadtrum / Itel
          vendor_keep_re = re.compile(
              r'(sprd|unisoc|itel|transsion|sc98|ums\d|t603|t606|t612|t616|marlin|wcn|shark|pike|orca|ud710|mali|powervr|rogue|goodix|silead|chipone|focaltech|novatek|ilitek|himax|synaptics|egistec|sunwave|cdfinger|betterlife|microarray|nvitem|engpc|ylog|cplog|phasecheck)',
              re.IGNORECASE
          )

          # Pola otomatis untuk keluarga library & antarmuka standar AOSP
          aosp_pattern_re = re.compile(
              r'^('
              r'(?!vendor\.).*-aidl-(cpp|ndk|ndk_platform|java|rust)|'
              r'.*_aidl_conversion.*|'
              r'.*_aidl_interface-.*|'
              r'android\.(hardware|hidl|frameworks|system|media|security)\..*|'
              r'libstagefright_.*|'
              r'libcodec2.*|'
              r'libsfplugin_ccodec.*|'
              r'lib_android_keymaster.*|'
              r'libkeymaster.*|'
              r'libbinder.*|'
              r'libhidl.*|'
              r'libaudiopolicy.*|'
              r'libmediadrm.*|'
              r'libneuralnetworks.*|'
              r'libext2.*|'
              r'libbpf.*|'
              r'libalsautils'
              r')$'
          )
          strip_bp_refs = {"readme", "libwifi-hal"}

          # 3. Parse blok modul Android.bp
          blocks = []
          cur = []
          depth = 0
          for line in open(p):
              cur.append(line)
              clean = line.split("//")[0]
              depth += clean.count("{") - clean.count("}")
              if depth <= 0 and cur:
                  blocks.append("".join(cur))
                  cur = []
                  depth = 0
          if cur:
              blocks.append("".join(cur))

          seen = {}
          seen_sigs = set()
          removed_mods = set(conflict_mods)
          kept_blocks = []
          for blk in blocks:
              m = re.search(r'(?m)^(\s*name:\s*")([^"]+)(".*)$', blk)
              if m:
                  mod_name = m.group(2)
                  is_vendor_prop = bool(vendor_keep_re.search(mod_name))
                  if not is_vendor_prop and (mod_name in conflict_mods or aosp_pattern_re.match(mod_name)):
                      removed_mods.add(mod_name)
                      continue
                  sig_m = re.search(r'^\s*([a-zA-Z0-9_]+)\s*\{', blk.lstrip())
                  mod_type = sig_m.group(1) if sig_m else ""
                  sub_m = re.search(r'\bsub_dir\s*:\s*"([^"]+)"', blk)
                  sub_dir = sub_m.group(1) if sub_m else ""
                  fn_m = re.search(r'\bfilename\s*:\s*"([^"]+)"', blk)
                  fn_name = fn_m.group(1) if fn_m else mod_name
                  sig = (mod_type, sub_dir, fn_name)
                  if sig in seen_sigs:
                      continue
                  seen_sigs.add(sig)
                  if mod_name in seen:
                      seen[mod_name] += 1
                      new_name = f"{mod_name}_dup_{seen[mod_name]}"
                      blk = re.sub(r'(?m)^(\s*name:\s*")([^"]+)(".*)$', rf'\g<1>{new_name}\g<3>', blk, count=1)
                  else:
                      seen[mod_name] = 1
              kept_blocks.append(blk)

          print(f"Total modul AOSP bentrok yang dihapus: {len(removed_mods)}")
          content = "".join(kept_blocks)

          # 4. Hapus referensi modul non-Soong di Android.bp
          for rmod in strip_bp_refs:
              content = re.sub(
                  rf'(?m)^([^\n]*\bname\s*:[^\n]*)|"{re.escape(rmod)}",?\s*',
                  lambda m: m.group(1) if m.group(1) else '',
                  content
              )

          # 5. Bersihkan referensi modul yang dihapus di file .mk
          for mk_path in glob.glob("**/*.mk", recursive=True):
              mk_txt = open(mk_path).read()
              for rmod in removed_mods:
                  mk_txt = re.sub(rf'(?m)^\s*{re.escape(rmod)}\s*\\?\s*\n', '', mk_txt)
              open(mk_path, "w").write(mk_txt)

          # 6. Remap protobuf 3.9.1 ke versi LineageOS 20
          for pb in ["libprotobuf-cpp-full-3.9.1", "libprotobuf-cpp-lite-3.9.1"]:
              if f'name: "{pb}"' not in content:
                  content = content.replace(f'"{pb}"', f'"{pb.replace("-3.9.1", "")}"')

          def add_prebuilt(mod_name, rel32, rel64):
              targets = []
              if rel32:
                  targets.append(f'        android_arm: {{\n            srcs: ["{rel32}"],\n        }},')
              if rel64:
                  targets.append(f'        android_arm64: {{\n            srcs: ["{rel64}"],\n        }},')
              if not targets:
                  return ""
              multilib = "both" if (rel32 and rel64) else ("64" if rel64 else "32")
              return (
                  f'\ncc_prebuilt_library_shared {{\n'
                  f'    name: "{mod_name}",\n'
                  f'    owner: "itel",\n'
                  f'    strip: {{\n        none: true,\n    }},\n'
                  f'    target: {{\n' + "\n".join(targets) + '\n    },\n'
                  f'    compile_multilib: "{multilib}",\n'
                  f'    check_elf_files: false,\n'
                  f'    prefer: true,\n'
                  f'    soc_specific: true,\n'
                  f'}}\n'
              )

          os.makedirs("proprietary/vendor/lib", exist_ok=True)
          os.makedirs("proprietary/vendor/lib64", exist_ok=True)

          # 7. Salin & daftarkan libc++_shared dari NDK bawaan runner
          if 'name: "libc++_shared"' not in content:
              all_cxx = [s for s in glob.glob("/usr/local/lib/android/**/libc++_shared.so", recursive=True) if os.path.isfile(s)]
              m32 = sorted([s for s in all_cxx if "armeabi-v7a" in s or "arm-linux-androideabi" in s])
              m64 = sorted([s for s in all_cxx if "arm64-v8a" in s or "aarch64-linux-android" in s])
              if m32 and m64:
                  shutil.copy(m32[-1], "proprietary/vendor/lib/libc++_shared.so")
                  shutil.copy(m64[-1], "proprietary/vendor/lib64/libc++_shared.so")
                  content += add_prebuilt("libc++_shared", "proprietary/vendor/lib/libc++_shared.so", "proprietary/vendor/lib64/libc++_shared.so")

          # 8. Salin & daftarkan libclang_rt.ubsan_standalone dari NDK bawaan runner
          for rt, sub in [("libclang_rt.ubsan_standalone-aarch64-android", "lib64"), ("libclang_rt.ubsan_standalone-arm-android", "lib")]:
              if f'name: "{rt}"' not in content:
                  src = sorted([s for s in glob.glob(f"/usr/local/lib/android/**/{rt}.so", recursive=True) if os.path.isfile(s)])
                  if src:
                      dst = f"proprietary/vendor/{sub}/{rt}.so"
                      shutil.copy(src[-1], dst)
                      content += add_prebuilt(rt, dst if sub == "lib" else None, dst if sub == "lib64" else None)

          open(p, "w").write(content)
          EOF

      - name: Push Perubahan ke Branch Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "vendor: sweep libbinderdebug and full A-Z AOSP prebuilt conflicts" || exit 0
          git push
